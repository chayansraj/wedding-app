<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Click to Enter">
  <defs>
    <radialGradient id="radiance" cx="50%" cy="54%" r="50%">
      <stop offset="0" stop-color="#ffe7a0" stop-opacity=".82"/>
      <stop offset=".22" stop-color="#f8d47a" stop-opacity=".58"/>
      <stop offset=".48" stop-color="#e9b45e" stop-opacity=".30"/>
      <stop offset=".72" stop-color="#d99645" stop-opacity=".12"/>
      <stop offset="1" stop-color="#d99645" stop-opacity="0"/>
    </radialGradient>
    <filter id="wideBlur" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="mediumBlur" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="textGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#f6d477" flood-opacity=".58" result="glow"/>
      <feComposite in="glow" in2="blur" operator="in" result="glowShape"/>
      <feMerge><feMergeNode in="glowShape"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Broad, soft radiance. No solid panel or enclosing boundary. -->
  <ellipse cx="450" cy="142" rx="390" ry="105" fill="url(#radiance)" filter="url(#wideBlur)"/>
  <ellipse cx="450" cy="143" rx="300" ry="66" fill="#f2c86d" opacity=".20" filter="url(#mediumBlur)"/>
  <ellipse cx="450" cy="143" rx="205" ry="38" fill="#ffe3a0" opacity=".16" filter="url(#mediumBlur)"/>

  <!-- Lotus motif -->
  <g fill="none" stroke="#f7d982" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".96">
    <path d="M450 38c-25 17-34 35 0 55 34-20 25-38 0-55Z"/>
    <path d="M450 45c-9 19-9 34 0 48 9-14 9-29 0-48Z"/>
    <path d="M450 93c-29-12-49-5-61 12 22 9 43 6 61-12Z"/>
    <path d="M450 93c29-12 49-5 61 12-22 9-43 6-61-12Z"/>
  </g>

  <!-- Fine traditional divider -->
  <g fill="none" stroke="#f7d982" stroke-width="1.6" stroke-linecap="round" opacity=".84">
    <path d="M150 125H335"/>
    <path d="M565 125H750"/>
  </g>

  <!-- Small floral end motifs -->
  <g fill="none" stroke="#f7d982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M150 125c-14-17-28-17-38 0 10 17 24 17 38 0Z"/>
    <path d="M150 125c14-17 28-17 38 0-10 17-24 17-38 0Z"/>
    <path d="M110 125H82M190 125h28"/>
    <path d="M750 125c14-17 28-17 38 0-10 17-24 17-38 0Z"/>
    <path d="M750 125c-14-17-28-17-38 0 10 17 24 17 38 0Z"/>
    <path d="M790 125h28M710 125h-28"/>
  </g>

  <!-- Invitation typography -->
  <text x="450" y="160" text-anchor="middle" fill="#fff3d2" font-family="Georgia, Times New Roman, serif" font-size="50" font-weight="400" filter="url(#textGlow)">Click to Enter</text>

  <!-- Delicate lower flourish -->
  <g fill="none" stroke="#f7d982" stroke-linecap="round" stroke-linejoin="round" opacity=".82">
    <path d="M335 190H565" stroke-width="1.4"/>
    <path d="M438 190c7-12 17-12 24 0 7-12 17-12 24 0" stroke-width="1.7"/>
    <path d="M450 207c-8 9-8 16 0 23 8-7 8-14 0-23Z" stroke-width="1.6"/>
  </g>
</svg>
